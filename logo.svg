<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Architectural design grid coordinates -->
  <line x1="50" y1="10" x2="50" y2="90" stroke="#151515" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.3" />
  <line x1="10" y1="50" x2="90" y2="50" stroke="#151515" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.3" />
  
  <!-- Outer composition framing circle -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#151515" stroke-width="1.5" />
  
  <!-- Balanced diagonal golden scale alignment line -->
  <line x1="30" y1="70" x2="70" y2="30" stroke="#BCA685" stroke-width="1.25" stroke-linecap="round" />
  
  <!-- Handcrafted Serif Monogram 'P' for Protus -->
  <!-- Stem, loop, and fine bracketed serifs -->
  <path d="M 44 32 L 56 32 C 64 32, 64 48, 56 48 L 44 48 M 44 32 L 44 68 M 39 32 L 49 32 M 39 68 L 49 68" 
        fill="none" 
        stroke="#151515" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Radiant focal design dot in warm terracotta -->
  <circle cx="68" cy="32" r="4.5" fill="#A57156" />
</svg>
